name: roblox-ci

on:
  push:
    paths:
      - "roblox/**"
      - ".github/workflows/roblox-ci.yml"
  pull_request:
    paths:
      - "roblox/**"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roblox
    steps:
      - uses: actions/checkout@v4

      - name: Install Roblox tooling
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          path: roblox
          cache: true

      - name: Format check
        run: stylua --check src tests

      - name: Lint
        run: |
          selene generate-roblox-std
          selene src tests

      - name: Build place
        run: |
          mkdir -p build
          rojo build default.project.json -o build/RaidABase.rbxl

      - name: Upload place file
        uses: actions/upload-artifact@v4
        with:
          name: RaidABase-rbxl
          path: roblox/build/RaidABase.rbxl
          retention-days: 14
